<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scanner PDF</title>
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scanner PDF">
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--ink:#16181d;--mute:#6b7280;--line:#e3e5ea;
  --accent:#0f766e;--accent-ink:#fff;--danger:#b42318;--stage:#1b1d22;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121316;--card:#1c1e23;--ink:#eceef2;--mute:#9aa1ad;--line:#2b2e35;--accent:#2dd4bf;--accent-ink:#052e2b;--danger:#f97066;--stage:#0b0c0e}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{max-width:720px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{padding:calc(14px + var(--sat)) 18px 8px;display:flex;align-items:baseline;justify-content:space-between}
header.top h1{margin:0;font-size:22px;letter-spacing:-.01em}
header.top span{color:var(--mute);font-size:14px}
main{flex:1;padding:6px 14px calc(110px + var(--sab))}
.empty{margin:12vh auto 0;text-align:center;max-width:320px;color:var(--mute)}
.empty .ill{width:84px;height:84px;margin:0 auto 14px;border-radius:22px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent)}
.empty .ill svg{width:40px;height:40px}
.empty h2{margin:0 0 6px;color:var(--ink);font-size:18px}
.empty p{margin:0;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pg{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pg .th{position:relative;aspect-ratio:3/4;background:var(--bg);display:grid;place-items:center;padding:8px;cursor:pointer}
.pg .th canvas{max-width:100%;max-height:100%;box-shadow:0 1px 6px rgba(0,0,0,.18);background:#fff}
.pg .num{position:absolute;left:8px;top:8px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 6px}
.pg .row{display:flex;justify-content:space-between;border-top:1px solid var(--line)}
.pg .row button{flex:1;height:42px;display:grid;place-items:center;color:var(--mute)}
.pg .row button:active{background:var(--bg)}
.pg .row button[disabled]{opacity:.3}
.pg .row .del{color:var(--danger)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + var(--sab));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;justify-content:center}
.bar .in{display:flex;gap:10px;width:100%;max-width:720px}
.btn{height:50px;border-radius:14px;padding:0 16px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;background:var(--card);border:1px solid var(--line)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent;flex:1.4}
.btn.sec{flex:1}
.btn[disabled]{opacity:.45;pointer-events:none}
/* editor */
#editor{position:fixed;inset:0;background:var(--stage);display:none;flex-direction:column;z-index:20;color:#fff}
#editor.on{display:flex}
.etop{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + var(--sat)) 12px 10px;gap:8px}
.etop .t{font-weight:600;font-size:15px;opacity:.9}
.etop button{height:40px;padding:0 14px;border-radius:12px;font-weight:600;color:#fff;display:flex;align-items:center;gap:6px}
.etop .ok{background:var(--accent);color:var(--accent-ink)}
#stage{flex:1;position:relative;min-height:0;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.etools{padding:12px 12px calc(12px + var(--sab));display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;background:#14151a}
.etools button{height:42px;padding:0 14px;border-radius:12px;background:#262932;color:#fff;display:flex;align-items:center;gap:6px;font-size:15px}
.etools button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.hint{position:absolute;left:0;right:0;top:8px;text-align:center;font-size:13px;color:#cfd3dc;pointer-events:none;text-shadow:0 1px 3px #000}
/* live */
#live{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:25;color:#fff}
#live.on{display:flex}
#lstage{flex:1;position:relative;min-height:0;overflow:hidden}
#lv{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#lov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#lstage.flash::after{content:"";position:absolute;inset:0;background:#fff;animation:fl .25s ease-out forwards}
@keyframes fl{from{opacity:.85}to{opacity:0}}
.ltop{position:absolute;left:0;right:0;top:0;padding:calc(10px + var(--sat)) 12px 8px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#000a,transparent);z-index:2}
.ltop button{height:40px;padding:0 14px;border-radius:12px;background:#0008;color:#fff;font-weight:600}
.lhint{position:absolute;left:0;right:0;top:calc(62px + var(--sat));text-align:center;font-size:13px;color:#e5e7eb;text-shadow:0 1px 3px #000;z-index:2;pointer-events:none}
.lbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 18px calc(16px + var(--sab));background:#000}
#lthumb{width:48px;height:64px;border-radius:8px;background:#222;object-fit:contain;justify-self:start;border:1px solid #444}
#lShot{width:74px;height:74px;border-radius:50%;background:#fff;border:5px solid #000;box-shadow:0 0 0 3px #fff}
#lShot:active{transform:scale(.93)}
#lShot[disabled]{opacity:.5}
#lDone{justify-self:end;height:44px;padding:0 18px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700}
/* sheet */
#sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:30;align-items:flex-end;justify-content:center}
#sheetbg.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + var(--sab));max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 14px;font-size:18px}
.lbl{font-size:13px;color:var(--mute);margin:14px 0 6px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:40px;border-radius:10px;font-size:15px}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.2);font-weight:600}
input[type=text]{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font:inherit}
.size{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding:12px 14px;background:var(--bg);border-radius:12px;font-size:15px}
.size b{font-size:18px}
.sheet .acts{display:flex;gap:10px;margin-top:16px}
.sheet .acts .btn{flex:1}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;place-items:center;z-index:50}
#busy.on{display:grid}
#busy i{width:42px;height:42px;border-radius:50%;border:4px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(96px + var(--sab));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header class="top"><h1>Scanner PDF <small id="ver" style="font-size:12px;font-weight:500;color:var(--mute)"></small></h1><span id="count"></span></header>
  <main id="main"></main>
  <div class="bar"><div class="in">
    <button class="btn sec" id="bGal"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8"/></svg>Galleria</button>
    <button class="btn pri" id="bCam"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-2.5h6L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.2" r="3.4"/></svg>Scatta</button>
    <button class="btn sec" id="bExp"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6M9.5 14.5L12 17l2.5-2.5"/></svg>PDF</button>
  </div></div>
</div>
<input id="fCam" type="file" accept="image/*" capture="environment" hidden>
<input id="fGal" type="file" accept="image/*" multiple hidden>

<div id="live">
  <div id="lstage"><video id="lv" playsinline muted autoplay></video><canvas id="lov"></canvas>
    <div class="ltop"><button id="lClose">Chiudi</button><span id="lCount"></span></div>
    <div class="lhint">Inquadra il foglio: il riquadro verde è la pagina che verrà acquisita</div></div>
  <div class="lbar"><canvas id="lthumb" width="48" height="64"></canvas><button id="lShot" aria-label="Scatta"></button><button id="lDone">Fine</button></div>
</div>
<div id="editor">
  <div class="etop">
    <button id="eBack"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Indietro</button>
    <span class="t" id="eTitle"></span>
    <button class="ok" id="eNext">Avanti</button>
  </div>
  <div id="stage"><canvas id="cv"></canvas><div class="hint" id="hint"></div></div>
  <div class="etools" id="eTools"></div>
</div>

<div id="sheetbg"><div class="sheet" id="sheet">
  <h3>Esporta PDF</h3>
  <div class="lbl">Nome file</div>
  <input type="text" id="xName" autocomplete="off">
  <div class="lbl">Compressione</div>
  <div class="seg" id="xQ"><button data-v="alta">Alta qualità</button><button data-v="media" class="on">Bilanciata</button><button data-v="bassa">Leggero</button></div>
  <div class="lbl">Formato pagina</div>
  <div class="seg" id="xF"><button data-v="a4" class="on">A4</button><button data-v="orig">Come la foto</button></div>
  <div class="size"><span id="xInfo">Calcolo…</span><b id="xSize"></b></div>
  <div class="acts"><button class="btn" id="xClose">Chiudi</button><button class="btn pri" id="xSave">Salva PDF</button></div>
</div></div>
<div id="busy"><i></i></div>
<div id="toast"></div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const ICON={
  left:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  right:'<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  rot:'<svg viewBox="0 0 24 24"><path d="M20 5v5h-5"/><path d="M19.5 10A8 8 0 1 0 20 14"/></svg>',
  crop:'<svg viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14M2 6h14a2 2 0 0 1 2 2v14"/></svg>',
  wand:'<svg viewBox="0 0 24 24"><path d="M4 20L16 8M14 6l1-3 1 3 3 1-3 1-1 3-1-3-3-1z"/></svg>',
  reset:'<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5"/></svg>'
};
const MAXSRC=2400, MAXWARP=2000;
const PRESETS={alta:{max:2200,q:.88},media:{max:1600,q:.72},bassa:{max:1100,q:.55}};
const state={pages:[],ed:null,q:'media',fmt:'a4'};

/* ---------- utilities ---------- */
const tick=()=>new Promise(r=>setTimeout(r,30));
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}
async function busy(fn){$('#busy').classList.add('on');await tick();try{return await fn()}finally{$('#busy').classList.remove('on')}}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function fmtSize(b){return b<1048576?Math.max(1,Math.round(b/1024))+' KB':(b/1048576).toFixed(2)+' MB'}
function loadImage(file){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const s=Math.min(1,MAXSRC/Math.max(im.naturalWidth,im.naturalHeight));
    const c=mk(Math.round(im.naturalWidth*s),Math.round(im.naturalHeight*s));
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c)};
  im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Immagine non leggibile'))};
  im.src=url;
})}

/* ---------- document detection ---------- */
function defaultQuad(w,h){const m=.04;return[{x:w*m,y:h*m},{x:w*(1-m),y:h*m},{x:w*(1-m),y:h*(1-m)},{x:w*m,y:h*(1-m)}]}
function quadArea(q){let a=0;for(let i=0;i<4;i++){const p=q[i],n=q[(i+1)%4];a+=p.x*n.y-n.x*p.y}return Math.abs(a)/2}
function isConvexQuad(q){
  let sgn=0;
  for(let i=0;i<4;i++){const a=q[i],b=q[(i+1)%4],c=q[(i+2)%4];
    const cr=(b.x-a.x)*(c.y-b.y)-(b.y-a.y)*(c.x-b.x);
    if(Math.abs(cr)<1e-6)return false;
    const s=cr>0?1:-1;if(sgn&&s!==sgn)return false;sgn=s;
    const v1x=a.x-b.x,v1y=a.y-b.y,v2x=c.x-b.x,v2y=c.y-b.y;
    const cos=(v1x*v2x+v1y*v2y)/((Math.hypot(v1x,v1y)*Math.hypot(v2x,v2y))||1);
    const ang=Math.acos(Math.max(-1,Math.min(1,cos)))*180/Math.PI;
    if(ang<50||ang>130)return false}
  return true;
}
function boxBlur3(s,w,h){
  const t=new Uint8Array(w*h),o=new Uint8Array(w*h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;t[i]=(s[x>0?i-1:i]+s[i]+s[x<w-1?i+1:i])/3}
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;o[i]=(t[y>0?i-w:i]+t[i]+t[y<h-1?i+w:i])/3}
  return o;
}
function otsuT(v){
  const hist=new Array(256).fill(0),n=v.length;let sum=0;
  for(let i=0;i<n;i++)hist[v[i]]++;for(let i=0;i<256;i++)sum+=i*hist[i];
  let wB=0,sB=0,best=-1,thr=128;
  for(let t=0;t<256;t++){wB+=hist[t];if(!wB)continue;const wF=n-wB;if(!wF)break;sB+=t*hist[t];
    const mB=sB/wB,mF=(sum-sB)/wF,s=wB*wF*(mB-mF)*(mB-mF);if(s>best){best=s;thr=t}}
  return thr;
}
function largestComp(mask,w,h){
  const n=w*h,lab=new Uint8Array(n),stack=new Int32Array(n);let best=null,bn=0;
  for(let s=0;s<n;s++){
    if(!mask[s]||lab[s])continue;let sp=0;const list=[];stack[sp++]=s;lab[s]=1;
    while(sp){const p=stack[--sp];list.push(p);const px=p%w,py=(p-px)/w;
      if(px>0&&mask[p-1]&&!lab[p-1]){lab[p-1]=1;stack[sp++]=p-1}
      if(px<w-1&&mask[p+1]&&!lab[p+1]){lab[p+1]=1;stack[sp++]=p+1}
      if(py>0&&mask[p-w]&&!lab[p-w]){lab[p-w]=1;stack[sp++]=p-w}
      if(py<h-1&&mask[p+w]&&!lab[p+w]){lab[p+w]=1;stack[sp++]=p+w}}
    if(list.length>bn){bn=list.length;best=list}
  }
  return best;
}
let _seed=12345;const rnd=()=>{_seed=(_seed*1664525+1013904223)>>>0;return _seed/4294967296};
function fitLine(P,iters){
  const N=P.length;if(N<10)return null;let best=null,bc=-1;
  for(let it=0;it<iters;it++){
    const A=P[(rnd()*N)|0],B=P[(rnd()*N)|0],dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy);if(L<6)continue;
    const nx=-dy/L,ny=dx/L;let c=0;
    for(const p of P)if(Math.abs((p.x-A.x)*nx+(p.y-A.y)*ny)<1.2)c++;
    if(c>bc){bc=c;best={A,nx,ny}}
  }
  if(!best)return null;
  const I=P.filter(p=>Math.abs((p.x-best.A.x)*best.nx+(p.y-best.A.y)*best.ny)<1.6);if(I.length<8)return null;
  let mx=0,my=0;for(const p of I){mx+=p.x;my+=p.y}mx/=I.length;my/=I.length;
  let sxx=0,sxy=0,syy=0;for(const p of I){const a=p.x-mx,b=p.y-my;sxx+=a*a;sxy+=a*b;syy+=b*b}
  const th=.5*Math.atan2(2*sxy,sxx-syy);
  return{x:mx,y:my,dx:Math.cos(th),dy:Math.sin(th)};
}
function isect(A,B){
  const cr=A.dx*B.dy-A.dy*B.dx;if(Math.abs(cr)<.2)return null;
  const rx=B.x-A.x,ry=B.y-A.y,t=(rx*B.dy-ry*B.dx)/cr;return{x:A.x+t*A.dx,y:A.y+t*A.dy};
}
function analyzeMask(mask,w,h,iters){
  const n=w*h,comp=largestComp(mask,w,h);if(!comp||comp.length<n*.08)return null;
  const m=new Uint8Array(n);for(const p of comp)m[p]=1;
  // riempi i buchi (il testo del foglio non deve bucare la maschera)
  const out=new Uint8Array(n),stack=new Int32Array(n);let sp=0;
  const seed=p=>{if(!m[p]&&!out[p]){out[p]=1;stack[sp++]=p}};
  for(let x=0;x<w;x++){seed(x);seed((h-1)*w+x)}for(let y=0;y<h;y++){seed(y*w);seed(y*w+w-1)}
  while(sp){const p=stack[--sp],px=p%w,py=(p-px)/w;
    if(px>0)seed(p-1);if(px<w-1)seed(p+1);if(py>0)seed(p-w);if(py<h-1)seed(p+w)}
  let area=0;const fl=new Uint8Array(n);for(let i=0;i<n;i++)if(!out[i]){fl[i]=1;area++}
  let a=1e9,b=-1e9,c=-1e9,d=1e9,tl,br,tr,bl;const pts=[];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;if(!fl[i])continue;
    const s=x+y,df=x-y;
    if(s<a){a=s;tl={x:x+.5,y:y+.5}}if(s>b){b=s;br={x:x+.5,y:y+.5}}
    if(df>c){c=df;tr={x:x+.5,y:y+.5}}if(df<d){d=df;bl={x:x+.5,y:y+.5}}
    if((x>0&&!fl[i-1])||(x<w-1&&!fl[i+1])||(y>0&&!fl[i-w])||(y<h-1&&!fl[i+w]))pts.push({x:x+.5,y:y+.5})}
  const cq=[tl,tr,br,bl],sides=[[],[],[],[]],tol=Math.max(w,h)*.07;
  for(const p of pts){let bd=1e9,bk=-1;
    for(let k=0;k<4;k++){const A=cq[k],B=cq[(k+1)%4],ex=B.x-A.x,ey=B.y-A.y,L2=ex*ex+ey*ey||1;
      const t=((p.x-A.x)*ex+(p.y-A.y)*ey)/L2;if(t<.08||t>.92)continue;
      const dd=Math.abs((p.x-A.x)*ey-(p.y-A.y)*ex)/Math.sqrt(L2);if(dd<bd){bd=dd;bk=k}}
    if(bk>=0&&bd<tol)sides[bk].push(p)}
  const cx=(tl.x+tr.x+br.x+bl.x)/4,cy=(tl.y+tr.y+br.y+bl.y)/4;
  const lines=sides.map(S=>{const L=fitLine(S,iters);if(!L)return null;
    let nx=-L.dy,ny=L.dx;if(nx*(L.x-cx)+ny*(L.y-cy)<0){nx=-nx;ny=-ny}
    L.x+=nx*.5;L.y+=ny*.5;return L});
  const diag=Math.hypot(w,h),pick=(A,B,fb)=>{
    if(!A||!B)return fb;const p=isect(A,B);
    return p&&Math.hypot(p.x-fb.x,p.y-fb.y)<diag*.12?p:fb};

/* ---------- perspective warp ---------- */
function homography(W,H,q){
  const dst=[[0,0],[W,0],[W,H],[0,H]],A=[];

    [A[c],A[p]]=[A[p],A[c]];const pv=A[c][c]||1e-12;

  const m=homography(W,H,q),sw=src.width,sh=src.height;

  const out=mk(W,H),octx=out.getContext('2d'),od=octx.createImageData(W,H),o=od.data;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const den=m[6]*x+m[7]*y+1;let u=(m[0]*x+m[1]*y+m[2])/den,v=(m[3]*x+m[4]*y+m[5])/den;
    const oi0=(y*W+x)*4;

  const ed=state.ed;ed.mode=mode;const t=$('#eTools');t.innerHTML='';
  if(mode==='crop'){
    $('#eTitle').textContent='Ritaglia';$('#eNext').textContent='Avanti';
    {const d=ed.p.det;$('#hint').textContent='Trascina gli angoli sui bordi del documento'+(d?(d.conf>=.35?' · rilevato '+Math.round(d.conf*100)+'%':' · bordi non rilevati'):'')}
    t.innerHTML='<button id="tAuto">'+ICON.wand+'Rileva</button><button id="tReset">'+ICON.reset+'Tutta la foto</button>';
    $('#tAuto').onclick=async()=>{const r=await busy(()=>detectDoc(ed.p.src));ed.p.quad=r.quad;ed.p.det=r;if(r.conf<.35)toast('Bordi non rilevati: regola gli angoli a mano');draw()};
    $('#tReset').onclick=()=>{ed.p.quad=defaultQuad(ed.p.src.width,ed.p.src.height);draw()};
  }else{
    $('#eTitle').textContent='Aspetto';$('#eNext').textContent='Fatto';$('#hint').textContent='';
    const F=[['original','Originale'],['enhanced','Migliorato'],['gray','Grigi'],['bw','B/N']];
    for(const[k,n]of F){const b=document.createElement('button');b.textContent=n;if(ed.p.filter===k)b.className='on';
      b.onclick=()=>setFilter(k);t.appendChild(b)}
    const r=document.createElement('button');r.innerHTML=ICON.rot+'Ruota';r.onclick=async()=>{ed.p.rot=(ed.p.rot+90)%360;await busy(()=>renderPage(ed.p));draw()};t.appendChild(r);
    const c=document.createElement('button');c.innerHTML=ICON.crop+'Ritaglia';c.onclick=()=>setMode('crop');t.appendChild(c);
  }
  requestAnimationFrame(()=>{layout();draw()});
}
async function setFilter(k){const p=state.ed.p;p.filter=k;await busy(()=>renderPage(p));setMode('filter')}
function layout(){
  const r=stage.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
}
function draw(){
  const ed=state.ed;if(!ed)return;
  const dpr=window.devicePixelRatio||1,W=cv.width/dpr,H=cv.height/dpr,x=cv.getContext('2d');
  x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
  const img=ed.mode==='crop'?ed.p.src:ed.p.out,pad=ed.mode==='crop'?26:14;
  const s=Math.min((W-pad*2)/img.width,(H-pad*2-24)/img.height);
  view={s,ox:(W-img.width*s)/2,oy:(H-img.height*s)/2+12};
  x.imageSmoothingQuality='high';x.drawImage(img,view.ox,view.oy,img.width*s,img.height*s);
  if(ed.mode!=='crop')return;
  const q=ed.p.quad.map(p=>({x:view.ox+p.x*s,y:view.oy+p.y*s}));
  x.save();x.beginPath();x.rect(view.ox,view.oy,img.width*s,img.height*s);
  x.moveTo(q[0].x,q[0].y);for(let i=3;i>=0;i--)x.lineTo(q[i].x,q[i].y);x.closePath();
  x.fillStyle='rgba(0,0,0,.55)';x.fill('evenodd');x.restore();
  x.beginPath();q.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.closePath();
  x.lineWidth=2;x.strokeStyle='#2dd4bf';x.stroke();
  q.forEach(p=>{x.beginPath();x.arc(p.x,p.y,13,0,7);x.fillStyle='rgba(15,118,110,.9)';x.fill();x.lineWidth=2.5;x.strokeStyle='#fff';x.stroke()});
  if(drag>=0){ // lente d'ingrandimento
    const h=q[drag],R=58,Z=3,side=2*R/(view.s*Z),p=ed.p.quad[drag];
    const cx=h.x<W/2?Math.min(W-R-8,h.x+R+34):Math.max(R+8,h.x-R-34),cy=h.y>R*2+90?h.y-R-46:h.y+R+46;
    x.save();x.beginPath();x.arc(cx,cy,R,0,7);x.clip();x.fillStyle='#000';x.fillRect(cx-R,cy-R,2*R,2*R);
    x.imageSmoothingQuality='high';x.drawImage(img,p.x-side/2,p.y-side/2,side,side,cx-R,cy-R,2*R,2*R);
    x.beginPath();ed.p.quad.forEach((pp,i)=>{const px=cx+(pp.x-p.x)*view.s*Z,py=cy+(pp.y-p.y)*view.s*Z;i?x.lineTo(px,py):x.moveTo(px,py)});x.closePath();
    x.lineWidth=1.5;x.strokeStyle='#2dd4bf';x.stroke();x.restore();
    x.beginPath();x.arc(cx,cy,R,0,7);x.lineWidth=3;x.strokeStyle='#fff';x.stroke();
    x.beginPath();x.moveTo(cx-9,cy);x.lineTo(cx+9,cy);x.moveTo(cx,cy-9);x.lineTo(cx,cy+9);x.lineWidth=1.5;x.strokeStyle='#fff';x.stroke();
  }
}
function evPt(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener('pointerdown',e=>{
  const ed=state.ed;if(!ed||ed.mode!=='crop')return;
  const pt=evPt(e);let bi=-1,bd=44;
  ed.p.quad.forEach((p,i)=>{const d=Math.hypot(view.ox+p.x*view.s-pt.x,view.oy+p.y*view.s-pt.y);if(d<bd){bd=d;bi=i}});
  if(bi>=0){const q=ed.p.quad[bi];drag=bi;dOff={x:view.ox+q.x*view.s-pt.x,y:view.oy+q.y*view.s-pt.y};cv.setPointerCapture(e.pointerId);draw()}
});
cv.addEventListener('pointermove',e=>{
  if(drag<0)return;const ed=state.ed,pt=evPt(e),img=ed.p.src;
  ed.p.quad[drag]={x:Math.min(img.width,Math.max(0,(pt.x+dOff.x-view.ox)/view.s)),y:Math.min(img.height,Math.max(0,(pt.y+dOff.y-view.oy)/view.s))};draw();
});
const endDrag=()=>{drag=-1;draw()};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
window.addEventListener('resize',()=>{if(state.ed){layout();draw()}});
$('#eBack').onclick=closeEditor;
$('#eNext').onclick=async()=>{
  const ed=state.ed;
  if(ed.mode==='crop'){
    if(quadArea(ed.p.quad)<400){toast('Area di ritaglio troppo piccola');return}
    await busy(()=>{ed.p.warped=warp(ed.p.src,ed.p.quad);renderPage(ed.p)});setMode('filter');
  }else closeEditor();
};

/* ---------- PDF writer ---------- */
function buildPdf(pages,fmt){
  const enc=new TextEncoder(),chunks=[],off=[];let len=0;
  const push=d=>{const u=typeof d==='string'?enc.encode(d):d;chunks.push(u);len+=u.length};
  const num=n=>(Math.round(n*100)/100).toString();
  const N=pages.length,total=2+3*N;
  push('%PDF-1.4\n%âãÏÓ\n');
  off[1]=len;push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  const kids=pages.map((_,i)=>(5+3*i)+' 0 R').join(' ');
  off[2]=len;push('2 0 obj\n<< /Type /Pages /Kids ['+kids+'] /Count '+N+' >>\nendobj\n');
  pages.forEach((pg,i)=>{
    const im=3+3*i,ct=4+3*i,po=5+3*i;
    let pw,ph,dw,dh,dx,dy;
    if(fmt==='a4'){
      const land=pg.w>pg.h;pw=land?842:595;ph=land?595:842;const m=14,s=Math.min((pw-2*m)/pg.w,(ph-2*m)/pg.h);
      dw=pg.w*s;dh=pg.h*s;dx=(pw-dw)/2;dy=(ph-dh)/2;
    }else{const s=72/150;pw=dw=pg.w*s;ph=dh=pg.h*s;dx=dy=0}
    off[im]=len;
    push('\n'.slice(0,0)+im+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+pg.w+' /Height '+pg.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+pg.jpeg.length+' >>\nstream\n');
    push(pg.jpeg);push('\nendstream\nendobj\n');
    const cs='q '+num(dw)+' 0 0 '+num(dh)+' '+num(dx)+' '+num(dy)+' cm /Im0 Do Q';
    off[ct]=len;push(ct+' 0 obj\n<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream\nendobj\n');
    off[po]=len;push(po+' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+num(pw)+' '+num(ph)+'] /Resources << /XObject << /Im0 '+im+' 0 R >> >> /Contents '+ct+' 0 R >>\nendobj\n');
  });
  const xr=len;let x='xref\n0 '+(total+1)+'\n0000000000 65535 f \n';
  for(let n=1;n<=total;n++)x+=String(off[n]).padStart(10,'0')+' 00000 n \n';
  push(x+'trailer\n<< /Size '+(total+1)+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF\n');
  return new Blob(chunks,{type:'application/pdf'});
}
const toBlob=(c,q)=>new Promise(r=>c.toBlob(r,'image/jpeg',q));
async function makePdf(){
  const pr=PRESETS[state.q],list=[];
  for(const p of state.pages){
    const c=scaleTo(p.out,pr.max),b=await toBlob(c,pr.q);
    list.push({jpeg:new Uint8Array(await b.arrayBuffer()),w:c.width,h:c.height});
  }
  return buildPdf(list,state.fmt);
}

/* ---------- export sheet ---------- */
let lastPdf=null,calcId=0;
async function recalc(){
  const id=++calcId;$('#xInfo').textContent='Calcolo…';$('#xSize').textContent='';$('#xSave').disabled=true;lastPdf=null;
  await tick();const b=await makePdf();if(id!==calcId)return;
  lastPdf=b;$('#xInfo').textContent=state.pages.length+(state.pages.length===1?' pagina':' pagine')+' · dimensione';$('#xSize').textContent=fmtSize(b.size);$('#xSave').disabled=false;
}
function openSheet(){
  $('#xName').value='Scansione-'+new Date().toISOString().slice(0,10);
  $('#sheetbg').classList.add('on');recalc();
}
function seg(id,key){
  $(id).onclick=e=>{const b=e.target.closest('button');if(!b)return;
    [...$(id).children].forEach(c=>c.classList.toggle('on',c===b));state[key]=b.dataset.v;recalc()};
}
seg('#xQ','q');seg('#xF','fmt');
$('#xClose').onclick=()=>$('#sheetbg').classList.remove('on');
$('#sheetbg').onclick=e=>{if(e.target.id==='sheetbg')$('#sheetbg').classList.remove('on')};
$('#xSave').onclick=async()=>{
  if(!lastPdf)return;
  let name=($('#xName').value||'Scansione').trim().replace(/[\\/:*?"<>|]+/g,'-');
  const dl=window.claude&&claude.use?await claude.use('downloads'):null;
  if(dl){
    try{await dl.save({filename:name+'.pdf',data:lastPdf});toast('PDF salvato');$('#sheetbg').classList.remove('on')}
    catch(e){if(e&&e.code!=='declined')toast('Salvataggio non riuscito')}
    return;
  }
  // fuori da Claude (sito proprio): condivisione di sistema, altrimenti download classico
  const file=new File([lastPdf],name+'.pdf',{type:'application/pdf'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});$('#sheetbg').classList.remove('on');return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const url=URL.createObjectURL(lastPdf),a=document.createElement('a');
  a.href=url;a.download=name+'.pdf';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);toast('PDF scaricato');$('#sheetbg').classList.remove('on');
};

/* ---------- fotocamera live ---------- */
let live=null,noLive=false;
async function startLive(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('nocam');
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:2560},height:{ideal:1440}},audio:false});
  const v=$('#lv');v.srcObject=stream;
  try{await v.play()}catch(e){}
  if(!v.videoWidth)await new Promise(r=>{v.onloadedmetadata=r;setTimeout(r,2500)});
  live={stream,q:null,miss:0,added:0,run:true,small:mk(16,16),busy:false,timer:0};
  $('#live').classList.add('on');updateLiveUi();loopLive();
}
function updateLiveUi(){
  $('#lCount').textContent=live.added?live.added+(live.added===1?' pagina':' pagine'):'';
  const t=$('#lthumb').getContext('2d');t.clearRect(0,0,48,64);
  const p=state.pages[state.pages.length-1];
  if(live.added&&p){const s=Math.min(48/p.thumb.width,64/p.thumb.height);t.drawImage(p.thumb,(48-p.thumb.width*s)/2,(64-p.thumb.height*s)/2,p.thumb.width*s,p.thumb.height*s)}
}
function qDist(a,b){let m=0;for(let i=0;i<4;i++)m=Math.max(m,Math.hypot(a[i].x-b[i].x,a[i].y-b[i].y));return m}
function loopLive(){
  if(!live||!live.run)return;
  const v=$('#lv');
  if(v.videoWidth&&!live.busy){
    const s=300/Math.max(v.videoWidth,v.videoHeight),w=Math.round(v.videoWidth*s),h=Math.round(v.videoHeight*s);
    if(live.small.width!==w||live.small.height!==h){live.small.width=w;live.small.height=h}
    live.small.getContext('2d').drawImage(v,0,0,w,h);
    const r=detectDoc(live.small,{work:300,iters:40,fast:true});
    if(r.conf>=.35){
      const nq=r.quad.map(p=>({x:p.x/w,y:p.y/h}));
      live.q=live.q&&qDist(live.q,nq)<.12?live.q.map((p,i)=>({x:p.x*.45+nq[i].x*.55,y:p.y*.45+nq[i].y*.55})):nq;live.miss=0;
    }else if(++live.miss>5)live.q=null;
    drawLive();
  }
  live.timer=setTimeout(loopLive,80);
}
function drawLive(){
  const v=$('#lv'),o=$('#lov'),dpr=window.devicePixelRatio||1,r=o.getBoundingClientRect();
  if(o.width!==Math.round(r.width*dpr)){o.width=Math.round(r.width*dpr);o.height=Math.round(r.height*dpr)}
  const x=o.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,r.width,r.height);
  if(!live.q||!v.videoWidth)return;
  const s=Math.min(r.width/v.videoWidth,r.height/v.videoHeight),ox=(r.width-v.videoWidth*s)/2,oy=(r.height-v.videoHeight*s)/2;
  const q=live.q.map(p=>({x:ox+p.x*v.videoWidth*s,y:oy+p.y*v.videoHeight*s}));
  x.beginPath();q.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.closePath();
  x.fillStyle='rgba(45,212,191,.22)';x.fill();x.lineWidth=3;x.strokeStyle='#2dd4bf';x.lineJoin='round';x.stroke();
  q.forEach(p=>{x.beginPath();x.arc(p.x,p.y,6,0,7);x.fillStyle='#fff';x.fill()});
}
async function shoot(){
  if(!live||live.busy)return;const v=$('#lv');if(!v.videoWidth)return;
  live.busy=true;$('#lShot').disabled=true;
  const s=Math.min(1,MAXSRC/Math.max(v.videoWidth,v.videoHeight)),src=mk(Math.round(v.videoWidth*s),Math.round(v.videoHeight*s));
  src.getContext('2d').drawImage(v,0,0,src.width,src.height);
  const st=$('#lstage');st.classList.remove('flash');void st.offsetWidth;st.classList.add('flash');
  const lq=live.q?live.q.map(p=>({x:p.x*src.width,y:p.y*src.height})):null;
  await tick();
  try{
    const r=detectDoc(src),quad=r.conf>=.35?r.quad:(lq||defaultQuad(src.width,src.height));
    newPage(src,quad,r);live.added++;updateLiveUi();
  }catch(e){toast('Scatto non riuscito')}
  live.busy=false;$('#lShot').disabled=false;
}
function closeLive(){
  if(!live)return;live.run=false;clearTimeout(live.timer);
  live.stream.getTracks().forEach(t=>t.stop());$('#lv').srcObject=null;
  const n=live.added;live=null;$('#live').classList.remove('on');renderGrid();
  if(n)toast(n+(n===1?' pagina aggiunta':' pagine aggiunte')+' — tocca una pagina per modificarla');
}
$('#lShot').onclick=shoot;$('#lDone').onclick=closeLive;$('#lClose').onclick=closeLive;
window.addEventListener('resize',()=>{if(live)drawLive()});

/* ---------- wiring ---------- */
$('#bCam').onclick=async()=>{
  if(!noLive){try{await startLive();return}catch(e){noLive=true;toast('Anteprima live non disponibile qui: uso la fotocamera del telefono')}}
  $('#fCam').click();
};
$('#bGal').onclick=()=>$('#fGal').click();
$('#bExp').onclick=openSheet;
for(const id of['#fCam','#fGal'])$(id).onchange=e=>{const f=[...e.target.files];e.target.value='';addFiles(f,{camera:id==='#fCam'})};
const VERSION='v3 · 25/11 14:40';$('#ver').textContent=VERSION;
renderGrid();
</script>
